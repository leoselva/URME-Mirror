<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URME Mirror</title>
    <!-- Downgraded to 1.4.2 for stable MindAR camera integration -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <!-- Configured mindar-face with autoStart explicitly enabled -->
    <a-scene 
      mindar-face="autoStart: true;" 
      embedded 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 1. Place your transparent 2D makeup PNG here -->
        <img id="myMakeupTexture" src="your-makeup-artwork.png" crossorigin="anonymous">
        
        <!-- 2. The default 3D face mesh model provided by MindAR -->
        <a-asset-item id="headModel" src="https://jsdelivr.net"></a-asset-item>
      </a-assets>

      <!-- FIXED: Changed active to "true" and added user-facing camera overrides -->
      <a-camera active="true" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- The tracking anchor target. anchorIndex: 1 maps to the center of the face -->
      
        
        <!-- This maps your 2D texture seamlessly across the visitor's face -->
        <a-gltf-model 
          src="#headModel" 
          material="src: #myMakeupTexture; transparent: true; opacity: 0.9;" 
          visible="true">
        </a-gltf-model>
        
      
    </scene>
  </body>
</html>
