<!DOCTYPE html>

<<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- FIXED: Explicitly loading version 1.4.2 to stabilize the camera stack -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-face 
      embedded 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
        <a-assets>
        <!-- Ensure this filename matches your texture perfectly -->
        <a-asset-item id="myMakeupTexture" src="your-makeup-artwork.png" crossorigin="anonymous"></a-asset-item>
        <a-asset-item id="headModel" src="canonical_face_model.obj"></a-asset-item>
      </a-assets>
    <a-camera active="false" position="0 0 0"></a-camera>
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-obj-model 
          src="#headModel" 
          material="src: #myMakeupTexture; transparent: true; opacity: 1.0;" 
          visible="true">
        </a-obj-model>
     </a-entity>
      
      
        <!-- Natively constructs the face mesh layer directly over the video tracker -->
        
        
      
    </a-scene>
  </body>
</html>
